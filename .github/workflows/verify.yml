name: Verify application

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: threat_hunting_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d threat_hunting_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      THREAT_HUNTING_TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-test-only@localhost:5432/threat_hunting_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned dependency tool
        run: python -m pip install uv==0.12.10
      - name: Install locked development dependencies
        run: uv sync --locked --extra dev
      - name: Check backend types
        run: uv run --locked --extra dev mypy
      - name: Test backend and PostgreSQL migration and concurrency behavior
        run: uv run --locked --extra dev pytest -q
      - name: Build the production backend image
        run: docker build -f deploy/docker/Dockerfile.backend -t threat-hunting:ci .

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run test:unit
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
        env:
          CI: "true"
