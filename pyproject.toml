[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-enabled-threat-hunting"
version = "0.1.0"
description = "Bounded, evidence-grounded threat hunting workspace."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "SQLAlchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
]

[project.scripts]
threat-hunting-api = "threat_hunting.main:run"
threat-hunting-worker = "threat_hunting.worker.main:run"
threat-hunting-worker-health = "threat_hunting.worker.healthcheck:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

