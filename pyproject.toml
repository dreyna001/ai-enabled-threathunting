[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-enabled-threat-hunting"
version = "0.1.0"
description = "Bounded, evidence-grounded threat hunting workspace."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "boto3>=1.43.89,<2",
  "fastapi>=0.115,<1",
  "openai>=2.54,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "SQLAlchemy>=2.0,<3",
  "splunk-sdk>=2.1.1,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "httpx2>=2.12,<3",
  "jsonschema>=4.23,<5",
  "mypy>=1.19,<2",
  "types-PyYAML>=6,<7",
  "pytest>=8.3,<9",
]

[project.scripts]
threat-hunting-api = "threat_hunting.main:run"
threat-hunting-worker = "threat_hunting.worker.main:run"
threat-hunting-worker-health = "threat_hunting.worker.healthcheck:run"
threat-hunting-account = "threat_hunting.auth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
# Starlette 1.6.0 still imports AnyIO 4.15's deprecated compatibility alias.
# Remove this exact filter after the upstream starlette#3497 fix is released.
filterwarnings = [
  "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated.*:DeprecationWarning:starlette\\.testclient",
]


[tool.mypy]
python_version = "3.12"
files = ["src/threat_hunting"]
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore.*", "splunklib.*"]
ignore_missing_imports = true
